[tool.poetry]
name = "aegis-platform"
version = "2.0.0"
description = "B2B Compliance & Audit Platform for IT Service Providers (DACH)"
authors = ["Aegis Security <security@aegis-platform.io>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cryptography = "^42.0.5"
slowapi = "^0.1.9"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

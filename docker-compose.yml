version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: always
    environment:
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: aegis_secure_password_2026
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: aegis-control-plane
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aegis_admin:aegis_secure_password_2026@postgres:5432/aegis_db
      SECRET_KEY: aegis_prod_jwt_secret_key_change_in_env_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

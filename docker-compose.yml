name: ${COMPOSE_PROJECT_NAME:-aegis-platform}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_db}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegis_admin} -d $${POSTGRES_DB:-aegis_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${CONTROL_PLANE_BIND_ADDRESS:-0.0.0.0}:${CONTROL_PLANE_PUBLISHED_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis_admin}:${POSTGRES_PASSWORD:-aegis_secure_password_2026}@postgres:5432/${POSTGRES_DB:-aegis_db}
      AEGIS_V2_DATABASE_URL: ${AEGIS_V2_DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Compose .env file}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      AGENT_UPDATE_VERSION: ${AGENT_UPDATE_VERSION:-}
      AGENT_UPDATE_URL: ${AGENT_UPDATE_URL:-}
      AGENT_UPDATE_SHA256: ${AGENT_UPDATE_SHA256:-}
      AGENT_UPDATE_OS_INFO: ${AGENT_UPDATE_OS_INFO:-}
      AGENT_UPDATE_SIGNATURE: ${AGENT_UPDATE_SIGNATURE:-}
      AEGIS_MTLS_ENABLED: "true"
      AEGIS_TLS_CERT_FILE: /run/aegis/tls/server.crt
      AEGIS_TLS_KEY_FILE: /run/aegis/tls/server.key
      AEGIS_TLS_CA_FILE: /run/aegis/tls/ca.crt
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in the Compose .env file}
    volumes:
      - ./certs/server:/run/aegis/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

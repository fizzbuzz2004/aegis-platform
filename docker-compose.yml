name: ${COMPOSE_PROJECT_NAME:-aegis-platform}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_db}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegis_admin} -d $${POSTGRES_DB:-aegis_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${CONTROL_PLANE_BIND_ADDRESS:-0.0.0.0}:${CONTROL_PLANE_PUBLISHED_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis_admin}:${POSTGRES_PASSWORD:-aegis_secure_password_2026}@postgres:5432/${POSTGRES_DB:-aegis_db}
      SECRET_KEY: ${SECRET_KEY:-aegis_prod_jwt_secret_key_change_in_env_2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-aegis_admin_password_2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

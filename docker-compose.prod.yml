services:
  control-plane:
    image: aegis-control-plane:latest
    ports:
      - "8000:8000"
    secrets:
      - DATABASE_URL
      - SECRET_KEY
      - ADMIN_INITIAL_PASSWORD
    environment:
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - AEGIS_MTLS_ENABLED=true
      - AEGIS_TLS_CERT_FILE=/run/aegis/tls/server.crt
      - AEGIS_TLS_KEY_FILE=/run/aegis/tls/server.key
      - AEGIS_TLS_CA_FILE=/run/aegis/tls/ca.crt
      - AGENT_UPDATE_VERSION=${AGENT_UPDATE_VERSION:-}
      - AGENT_UPDATE_URL=${AGENT_UPDATE_URL:-}
      - AGENT_UPDATE_SHA256=${AGENT_UPDATE_SHA256:-}
      - AGENT_UPDATE_OS_INFO=${AGENT_UPDATE_OS_INFO:-}
    volumes:
      - ./certs/server:/run/aegis/tls:ro

secrets:
  DATABASE_URL:
    file: ./secrets/db_url.txt
  SECRET_KEY:
    file: ./secrets/secret_key.txt
  ADMIN_INITIAL_PASSWORD:
    file: ./secrets/admin_pw.txt
